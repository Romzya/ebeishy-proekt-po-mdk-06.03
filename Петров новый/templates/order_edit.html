{% extends 'base.html' %}
{% block title %}Редактирование заказа #{{ order.id }}{% endblock %}

{% block content %}
<div class="container section">
    <a href="{{ url_for('order_view', token=order.token) }}" class="btn btn--outline btn--sm">← К заказу</a>

    <h1 class="page-title" style="margin-top:16px;">✏️ Редактирование заказа #{{ order.id }}</h1>

    <form method="post" class="admin-form">
        <div class="form-group">
            <label>Имя и фамилия *</label>
            <input type="text" name="full_name" required value="{{ form.full_name or order.full_name }}">
        </div>

        <div class="form-group">
            <label>Телефон *</label>
            <input type="tel" name="phone" required value="{{ form.phone or order.phone }}">
        </div>

        <div class="form-group">
            <label>Адрес доставки *</label>
            <textarea name="address" rows="3" required>{{ form.address or order.address }}</textarea>
        </div>

        <div class="form-hint">
            ℹ️ Товары и данные карты изменить нельзя. Если нужны другие товары — отмените заказ и оформите новый.
        </div>

        <div class="checkout-actions">
            <a href="{{ url_for('order_view', token=order.token) }}" class="btn btn--outline">Отмена</a>
            <button type="submit" class="btn btn--primary btn--lg">💾 Сохранить</button>
        </div>
    </form>
</div>
{% endblock %}
